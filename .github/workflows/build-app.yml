# The app moved to its own repository. Do not publish container images here:
# this repository's release tags version the HACS integration, not the app.
# Keep this manual-only notice so existing workflow bookmarks explain the move.
name: Legacy app build - moved to add-on repository

on:
  workflow_dispatch:

permissions: {}

jobs:
  moved:
    name: App publishing is managed in the add-on repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain repository split
        shell: bash
        run: |
          cat <<'NOTICE' | tee -a "$GITHUB_STEP_SUMMARY"
          # App build moved

          This repository contains the Go source and the HACS integration.
          Publishing a HACS release must not rebuild or overwrite app images.

          App builds and GHCR publishing are managed exclusively here:
          https://github.com/xmemphis-xyz/homeassistant-addon-spiroflex-vent-clear/actions

          Use the existing "Test backend and BOOST controls" workflow in this
          repository for Go and Python checks. Do not rerun historical app builds
          from old release tags: they still contain the retired Dockerfile.
          NOTICE
